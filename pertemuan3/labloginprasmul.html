<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f2f2f2;
                margin: 0;
                padding: 0;
            }
            .container {
                width: 400px;
                max-width: calc(100% - 40px);
                margin: 40px auto;
            }
            .container p {
                text-align: left;
            }
            .field-label {
                margin: 0 0px 10px;
            }
            .forgot-password {
                display: block;
                width: 65%;
                margin: -6px 0 1px;
                text-align: right;
            }
            h1 {
                color: #333;    
            }
            input[type="email"],
            input[type="password"] {
                width: 65%;
                box-sizing: border-box;
                padding: 10px;
                margin: 0 0 15px;
                border: 1px solid #ccc;
                border-radius: 8px;
            }
            button {
                background-color:    hsl(224, 71%, 38%);
                color: white;
                padding: 10px 107px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
            }
            button:hover {
                background-color: #0d2dcd;
            }
        </style>
    </head>
    <body>
        <div class="container">

            <h1>Welcome</h1>
            <p style="color: rgb(104, 104, 104);">Please enter your login credentials</p>

    <p class="field-label">Email</p>
    <input type="email" name="email" placeholder="Enter your email">
    <p class="field-label">Password</p>
    <input type="password" name="password" placeholder="Enter your password">
    <i class="forgot-password"><a href="#">Forgot Password?</a></i>
    <br>
    <label>
        <input type="checkbox" name="" value="ImNotARobot">
        Im not a robot
    </label>
    <br><br>
    <button>SIGN IN</button>
    <p style="color: #666;">Dont have an account? <a href="#">Sign up</a></p>
    <p style="color: #666;"> Please use <strong style="color: #333;">Google Chrome</strong> or <strong style="color: #333;">Mozilla Firefox</strong> for the best experience.</p>
</div>
</body>
</html>
