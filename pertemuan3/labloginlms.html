<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('bg_login_mdl.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .login-layout {
            display: flex;
            width: 900px;
            align-items: stretch;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
        }
        .container {
            width: 50%;
            min-height: 380px;
            padding: 40px;
            background-color: white;
            box-sizing: border-box;
        }
        .info-panel {
            width: 50%;
            padding: 40px 30px;
            border-left: 1px solid #d7d7d7;
            color: #676f79;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }
        .info-panel p {
            margin: 0 0 24px;
            line-height: 1.5;
        }
        @media (max-width: 850px) {
            body {
                padding: 20px;
            }
            .login-layout {
                width: 100%;
                max-width: 600px;
                flex-direction: column;
            }
            .container,
            .info-panel {
                width: 100%;
            }
            .info-panel {
                border-left: none;
                border-top: 1px solid #d7d7d7;
            }
        }
        .container img {
            width: 220px;
            height: auto;
            display: block;
            margin: -15px -5px 10px;
        }
        .login-form input {
            width: 70%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            background-color: hsl(222, 9%, 45%);
            color: white;
            padding: 10px 112px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="login-layout">
        <div class="container">
            <img src="logo_upm_biru.png" alt="Logo">
            <form class="login-form">
                <input type="email" placeholder="Username or email">
                <input type="password" placeholder="Enter your password">
                <br>
                <button type="submit">Log in</button>
                <p class="forgot-password"><a href="#" style="color: #676f79;">Lost password?</a></p>
            </form>
        </div>
        <aside class="info-panel">
            <p style="color: black;">This site best viewed in Google Chrome</p>
            <p>Cookies notice</p>
        </aside>
    </div>
</body>
